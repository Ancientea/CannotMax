repos:
  - repo: local
    hooks:
      - id: ruff-lint
        name: ruff (lint)
        entry: ruff check
        language: system
        types: [python]
      - id: ruff-check-imports
        name: ruff (import sorting)
        entry: ruff check --select I --fix
        language: system
        types: [python]
        pass_filenames: false
      - id: ruff-format
        name: ruff (format)
        entry: ruff format
        language: system
        types: [python]
        pass_filenames: false
