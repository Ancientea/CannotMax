repos:
  - repo: local
    hooks:
      - id: ruff-check-imports
        name: ruff (import sorting)
        entry: uv run ruff check --select I --fix
        language: system
        types: [python]
        pass_filenames: false
      - id: ruff-format
        name: ruff (format)
        entry: uv run ruff format
        language: system
        types: [python]
        pass_filenames: false
